[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repodocs"
version = "0.1.0"
description = "Scan a codebase and generate an AI-written README.md using Groq."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "groq>=1.1.1",
    "pyyaml",
    "pathspec>=1.0.3",
]

[project.scripts]
repodocs = "repodocs.cli:main"

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["."]
include = ["repodocs*"]
